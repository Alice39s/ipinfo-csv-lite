name: Auto Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish a pre-release without updating releases/latest
        required: true
        type: boolean
        default: true
      tag:
        description: Pre-release tag (ignored for stable releases)
        required: true
        type: string
        default: 2.0.0-rc.1
  schedule:
    - cron: "0 12 * * *" # Every day at 12:00 UTC

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run checks
        run: make vet test

  release:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: ipinfo-release
      cancel-in-progress: false
    permissions:
      contents: write # create releases and upload assets
      id-token: write # sign artifact attestations
      attestations: write # publish artifact attestations

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Execute workflow
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: make

      - name: Get current tag
        id: tag
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PRERELEASE" == "true" ]]; then
            if [[ ! "$REQUESTED_TAG" =~ ^2\.0\.0-(alpha|beta|rc)\.[1-9][0-9]*$ ]]; then
              echo "Invalid pre-release tag: $REQUESTED_TAG" >&2
              exit 1
            fi
            release_tag="$REQUESTED_TAG"
            prerelease=true
          else
            release_tag="2.0.0-$(date +'%Y-%m-%d')"
            prerelease=false
          fi
          {
            echo "tag=$release_tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # Cryptographically bind each artifact to this commit (Sigstore).
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            data/ipinfo-lite.csv
            data/ipinfo-lite.csv.gz
            data/ipinfo-lite.csv.xz
            data/ipinfo-lite.csv.zst
            data/ipinfo-lite.mmdb
            data/ipinfo-lite.ipv4.xdb
            data/ipinfo-lite.ipv6.xdb
            data/checksums.txt

      # Immutable-release flow: create a draft, attach all assets, publish last.
      # NOTE: immutable releases are a repository setting (Settings ->
      # "Enable release immutability"); once enabled, publishing locks the
      # tag and assets. GITHUB_TOKEN cannot toggle it from a workflow.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          name: ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            LICENSE.DATABASE
            data/ipinfo-lite.csv
            data/ipinfo-lite.csv.gz
            data/ipinfo-lite.csv.xz
            data/ipinfo-lite.csv.zst
            data/ipinfo-lite.mmdb
            data/ipinfo-lite.ipv4.xdb
            data/ipinfo-lite.ipv6.xdb
            data/checksums.txt
          body: |
            IPinfo CSV Lite Database Release ${{ steps.tag.outputs.tag }}

            This release includes:
            - ipinfo-lite.csv
            - ipinfo-lite.csv.gz (gzip compressed)
            - ipinfo-lite.csv.xz (xz compressed)
            - ipinfo-lite.csv.zst (zstd compressed)
            - ipinfo-lite.mmdb (MaxMind DB)
            - ipinfo-lite.ipv4.xdb / ipinfo-lite.ipv6.xdb (ip2region xdb)
            - checksums.txt (SHA-256 of all artifacts)

            All artifacts carry Sigstore build-provenance attestations;
            verify with `gh attestation verify <file> --repo Alice39s/ipinfo-csv-lite`.

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
