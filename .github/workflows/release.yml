name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # Every day at 12:00 UTC

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create releases and upload assets
      id-token: write # sign artifact attestations
      attestations: write # publish artifact attestations

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run checks
        run: make vet test

      - name: Export IPINFO_TOKEN
        run: echo "IPINFO_TOKEN=${{ secrets.IPINFO_TOKEN }}" >> "$GITHUB_ENV"

      - name: Execute workflow
        run: make

      - name: Get current tag
        id: tag
        run: echo "tag=2.0.0-$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # Cryptographically bind each artifact to this commit (Sigstore).
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            data/ipinfo-lite.csv
            data/ipinfo-lite.csv.gz
            data/ipinfo-lite.csv.xz
            data/ipinfo-lite.csv.zst
            data/ipinfo-lite.mmdb
            data/ipinfo-lite.ipv4.xdb
            data/ipinfo-lite.ipv6.xdb
            data/checksums.txt

      # Immutable-release flow: create a draft, attach all assets, publish last.
      # NOTE: immutable releases are a repository setting (Settings ->
      # "Enable release immutability"); once enabled, publishing locks the
      # tag and assets. GITHUB_TOKEN cannot toggle it from a workflow.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            LICENSE.DATABASE
            data/ipinfo-lite.csv
            data/ipinfo-lite.csv.gz
            data/ipinfo-lite.csv.xz
            data/ipinfo-lite.csv.zst
            data/ipinfo-lite.mmdb
            data/ipinfo-lite.ipv4.xdb
            data/ipinfo-lite.ipv6.xdb
            data/checksums.txt
          body: |
            IPinfo CSV Lite Database Release ${{ steps.tag.outputs.tag }}

            This release includes:
            - ipinfo-lite.csv
            - ipinfo-lite.csv.gz (gzip compressed)
            - ipinfo-lite.csv.xz (xz compressed)
            - ipinfo-lite.csv.zst (zstd compressed)
            - ipinfo-lite.mmdb (MaxMind DB)
            - ipinfo-lite.ipv4.xdb / ipinfo-lite.ipv6.xdb (ip2region xdb)
            - checksums.txt (SHA-256 of all artifacts)

            All artifacts carry Sigstore build-provenance attestations;
            verify with `gh attestation verify <file> --repo Alice39s/ipinfo-csv-lite`.

      - name: Publish release
        run: gh release edit "${{ steps.tag.outputs.tag }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
