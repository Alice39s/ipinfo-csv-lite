name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # Every day at 12:00 UTC

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Export IPINFO_TOKEN
        run: echo "IPINFO_TOKEN=${{ secrets.IPINFO_TOKEN }}" >> $GITHUB_ENV

      - name: Execute workflow
        run: make

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: 2.0.0-${{ steps.date.outputs.date }}
          tag_name: 2.0.0-${{ steps.date.outputs.date }}
          files: |
            LICENSE.DATABASE
            data/ipinfo-lite.csv
            data/ipinfo-lite.csv.gz
            data/ipinfo-lite.csv.xz
          body: |
            IPinfo CSV Lite Database Release ${{ steps.date.outputs.date }}

            This release includes:
            - ipinfo-lite.csv
            - ipinfo-lite.csv.gz (gzip compressed)
            - ipinfo-lite.csv.xz (xz compressed)
