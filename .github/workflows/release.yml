name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # Every day at 12:00 UTC

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.14

      - name: Export IPINFO_TOKEN
        run: echo "IPINFO_TOKEN=${{ secrets.IPINFO_TOKEN }}" >> $GITHUB_ENV

      - name: Execute workflow
        run: |
          chmod +x workflow.sh
          bash workflow.sh

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: 1.0.1-${{ steps.date.outputs.date }}
          tag_name: 1.0.1-${{ steps.date.outputs.date }}
          files: |
            LICENSE.DATABASE
            libs/ipinfo-lite.csv
            libs/ipinfo-lite.csv.gz
            libs/ipinfo-lite.csv.xz
          body: |
            IPinfo CSV Lite Database Release ${{ steps.date.outputs.date }}

            This release includes:
            - ipinfo-lite.csv
            - ipinfo-lite.csv.gz (gzip compressed)
            - ipinfo-lite.csv.xz (xz compressed)
